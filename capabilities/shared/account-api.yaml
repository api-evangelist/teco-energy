naftiko: "1.0.0-alpha1"

info:
  label: "Tampa Electric Account API"
  description: "Customer account management including billing, energy usage, payments, and service requests."
  tags:
    - TECO Energy
    - Tampa Electric
    - Account Management
    - Billing
    - Energy Usage
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TECO_API_TOKEN: TECO_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: teco-account
      baseUri: https://api.tecoenergy.com/v1
      description: "Tampa Electric Account API for customer account management."
      authentication:
        type: bearer
        token: "{{TECO_API_TOKEN}}"
      resources:
        - name: accounts
          path: /accounts
          description: "Tampa Electric customer accounts."
          operations:
            - name: get-account
              method: GET
              description: "Get customer account details."
              inputParameters:
                - name: accountNumber
                  in: path
                  type: string
                  required: true
                  description: "Customer account number."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: usage
          path: /accounts/{accountNumber}/usage
          description: "Energy usage history for a customer account."
          operations:
            - name: get-usage-history
              method: GET
              description: "Get energy usage history by date range and interval."
              inputParameters:
                - name: accountNumber
                  in: path
                  type: string
                  required: true
                  description: "Customer account number."
                - name: startDate
                  in: query
                  type: string
                  required: false
                  description: "Start date for usage history (YYYY-MM-DD)."
                - name: endDate
                  in: query
                  type: string
                  required: false
                  description: "End date for usage history (YYYY-MM-DD)."
                - name: interval
                  in: query
                  type: string
                  required: false
                  description: "Data interval: hourly, daily, or monthly."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: bills
          path: /accounts/{accountNumber}/bills
          description: "Billing history for a customer account."
          operations:
            - name: list-bills
              method: GET
              description: "List billing history for a customer account."
              inputParameters:
                - name: accountNumber
                  in: path
                  type: string
                  required: true
                  description: "Customer account number."
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of bills to return."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: get-bill
              method: GET
              description: "Get detailed information for a specific bill."
              inputParameters:
                - name: accountNumber
                  in: path
                  type: string
                  required: true
                  description: "Customer account number."
                - name: billId
                  in: path
                  type: string
                  required: true
                  description: "Unique bill identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: make-payment
              method: POST
              description: "Submit a payment for a customer account."
              inputParameters:
                - name: accountNumber
                  in: path
                  type: string
                  required: true
                  description: "Customer account number."
              body:
                type: json
                data:
                  amount: "{{tools.amount}}"
                  paymentMethod: "{{tools.paymentMethod}}"
                  paymentDate: "{{tools.paymentDate}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: service-requests
          path: /accounts/{accountNumber}/service-requests
          description: "Service requests for a customer account."
          operations:
            - name: list-service-requests
              method: GET
              description: "List service requests for a customer account."
              inputParameters:
                - name: accountNumber
                  in: path
                  type: string
                  required: true
                  description: "Customer account number."
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by service request status."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-service-request
              method: POST
              description: "Submit a new service request."
              inputParameters:
                - name: accountNumber
                  in: path
                  type: string
                  required: true
                  description: "Customer account number."
              body:
                type: json
                data:
                  type: "{{tools.type}}"
                  preferredDate: "{{tools.preferredDate}}"
                  notes: "{{tools.notes}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: teco-account-rest
      resources:
        - path: /v1/accounts/{accountNumber}
          name: account
          operations:
            - method: GET
              name: get-account
              description: "Get Tampa Electric customer account details."
              call: "teco-account.get-account"
              with:
                accountNumber: "rest.accountNumber"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/accounts/{accountNumber}/usage
          name: usage
          operations:
            - method: GET
              name: get-usage-history
              description: "Get energy usage history."
              call: "teco-account.get-usage-history"
              with:
                accountNumber: "rest.accountNumber"
                startDate: "rest.startDate"
                endDate: "rest.endDate"
                interval: "rest.interval"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: teco-account-mcp
      transport: http
      tools:
        - name: get-account
          description: "Get Tampa Electric customer account details and current balance."
          hints:
            readOnly: true
          call: "teco-account.get-account"
          with:
            accountNumber: "tools.accountNumber"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-usage-history
          description: "Get energy usage history for a Tampa Electric account."
          hints:
            readOnly: true
          call: "teco-account.get-usage-history"
          with:
            accountNumber: "tools.accountNumber"
            startDate: "tools.startDate"
            endDate: "tools.endDate"
            interval: "tools.interval"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-bills
          description: "List billing history for a Tampa Electric account."
          hints:
            readOnly: true
          call: "teco-account.list-bills"
          with:
            accountNumber: "tools.accountNumber"
            limit: "tools.limit"
          outputParameters:
            - type: array
              mapping: "$."
        - name: list-service-requests
          description: "List service requests for a Tampa Electric account."
          hints:
            readOnly: true
          call: "teco-account.list-service-requests"
          with:
            accountNumber: "tools.accountNumber"
            status: "tools.status"
          outputParameters:
            - type: array
              mapping: "$."
