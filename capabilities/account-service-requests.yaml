naftiko: 1.0.0-alpha2
info:
  label: Tampa Electric Account API — Service Requests
  description: 'Tampa Electric Account API — Service Requests. 2 operations. Lead operation: List Service Requests. Self-contained
    Naftiko capability covering one Teco Energy business surface.'
  tags:
  - Teco Energy
  - Service Requests
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECO_ENERGY_API_KEY: TECO_ENERGY_API_KEY
capability:
  consumes:
  - type: http
    namespace: account-service-requests
    baseUri: https://api.tecoenergy.com/v1
    description: Tampa Electric Account API — Service Requests business capability. Self-contained, no shared references.
    resources:
    - name: accounts-accountNumber-service-requests
      path: /accounts/{accountNumber}/service-requests
      operations:
      - name: listservicerequests
        method: GET
        description: List Service Requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountNumber
          in: path
          type: string
          description: Customer account number.
          required: true
        - name: status
          in: query
          type: string
          description: Filter by service request status.
      - name: createservicerequest
        method: POST
        description: Create Service Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountNumber
          in: path
          type: string
          description: Customer account number.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TECO_ENERGY_API_KEY}}'
  exposes:
  - type: rest
    namespace: account-service-requests-rest
    port: 8080
    description: REST adapter for Tampa Electric Account API — Service Requests. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/accounts/{accountnumber}/service-requests
      name: accounts-accountnumber-service-requests
      description: REST surface for accounts-accountNumber-service-requests.
      operations:
      - method: GET
        name: listservicerequests
        description: List Service Requests
        call: account-service-requests.listservicerequests
        with:
          accountNumber: rest.accountNumber
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createservicerequest
        description: Create Service Request
        call: account-service-requests.createservicerequest
        with:
          accountNumber: rest.accountNumber
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: account-service-requests-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tampa Electric Account API — Service Requests. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-service-requests
      description: List Service Requests
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: account-service-requests.listservicerequests
      with:
        accountNumber: tools.accountNumber
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: create-service-request
      description: Create Service Request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: account-service-requests.createservicerequest
      with:
        accountNumber: tools.accountNumber
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
