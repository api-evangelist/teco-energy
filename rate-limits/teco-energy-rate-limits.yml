specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: TECO Energy
providerId: teco-energy
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Energy
  - Utilities
  - Electric
  - Natural Gas
  - Smart Grid
  - Tampa Bay
  - Rate Limiting
description: Rate-limit policy for the Tampa Electric / TECO Energy API surface is not publicly
  documented. The portal sits behind Azure API Management, whose default subscription-key throttling
  applies, but TECO Energy does not publish per-second or per-minute numbers.
sources:
  - https://developer.tecoenergy.com/
notes: The developer portal requires sign-in to view rate-limit and quota details. Specific limits
  are presumed to be set as Azure API Management subscription-level policies and communicated on
  approval, but cannot be reconciled from the public surface.
responseCodes:
  throttled: 429
limits:
  - name: Azure API Management Default
    scope: subscription-key
    metric: varies
    limit: see TECO Energy on approval
    notes: TECO Energy uses Azure APIM; product / subscription / IP-based throttling policies are
      presumed to apply but specific values are not published.
policies:
  - name: Sign-In Required
    description: Quota and rate-limit specifics are visible only after subscribing to a product in
      the developer portal; they are not published in the public catalog.
maintainers:
