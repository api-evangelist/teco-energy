aid: teco-energy
name: TECO Energy
description: >-
  TECO Energy is an energy holding company and subsidiary of Emera Inc., operating Tampa Electric (electric utility
  serving west central Florida) and Peoples Gas (natural gas utility serving Florida). TECO Energy provides a developer
  portal powered by Azure API Management at developer.tecoenergy.com, exposing APIs for outage management, account
  services, energy usage, billing, and grid operations. Tampa Electric serves approximately 800,000 customers across the
  Tampa Bay area and parts of central Florida.
