specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: TECO Energy
providerId: teco-energy
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Energy
  - Utilities
  - Electric
  - Natural Gas
  - Smart Grid
  - Tampa Bay
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps shape for TECO Energy's Tampa Electric API surface. Access is
  partner-gated and not consumption-priced as a developer product; this artifact captures the
  publisher identity and a placeholder meter only.
sources:
  - https://developer.tecoenergy.com/
notes: TECO Energy does not publish a developer-API price list. There is no public usage-billing
  surface to map onto FOCUS columns. Meters and FOCUS values below describe identity only; charge
  categories, currency conventions, and unit pricing are not reconciled.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: TECO Energy, Inc.
serviceCategory: Energy / Utilities
billingModel:
  pricingCategory: Contract / Partner-Negotiated
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Tampa Electric API Management
  ServiceCategory: Energy / Utilities
  ProviderName: TECO Energy
  PublisherName: TECO Energy, Inc.
  InvoiceIssuerName: TECO Energy, Inc.
  BillingCurrency: USD
meters:
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - subscription
principles:
  - name: Visibility
    description: API usage is visible to the partner through the Azure API Management developer
      portal; there is no published TECO Energy spend dashboard for API consumption.
  - name: Allocation
    description: Allocation is by Azure APIM subscription key issued to a specific partner program.
  - name: Optimization
    description: Optimization is bounded by the partner's contractual access tier; there are no
      publicly documented cost levers (committed use, caching tiers) for this API surface.
  - name: Accountability
    description: The named partner organization is the accountable owner of API consumption under
      its TECO Energy access agreement.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
